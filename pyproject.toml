[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsktui"
version = "0.1.0"
description = "⎈ Interactive Terminal User Interface for The Sleuth Kit (TSK) & DFIR Triage (ncdu/k9s style)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Shmulik Cohen", email = "shmulik@example.com" }
]
keywords = [
    "forensics",
    "dfir",
    "sleuthkit",
    "tui",
    "k9s",
    "ncdu",
    "ctf",
    "incident-response",
    "autopsy",
    "disk-analysis",
    "textual"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities"
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.scripts]
tsktui = "tsktui.cli:main"
tsk-tui = "tsktui.cli:main"

[project.urls]
Homepage = "https://github.com/shmulc8/tsktui"
Repository = "https://github.com/shmulc8/tsktui.git"
Issues = "https://github.com/shmulc8/tsktui/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tsktui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
